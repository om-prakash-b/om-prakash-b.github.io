name: Check links and assets

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
  workflow_dispatch: {}

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --remap 'https://om-prakash-b.github.io/ file://.' './**/*.html'
          fail: true
